{% extends "mail/_layout.html" %}
{% block content %}
<p style="margin:0 0 12px;">{{ _("Hello {name},", name=user.name) }}</p>
<p style="margin:0 0 12px;">{{ _("the automatic backup has <b>failed</b>:") }}</p>
<p style="margin:0 0 12px;padding:10px 14px;background:#fbeeea;border-radius:8px;font-family:Consolas,monospace;font-size:13px;">{{ localize(message) if localize else message }}</p>
{% if base_url %}<p style="margin:20px 0;"><a href="{{ base_url }}/admin/datensicherung" style="background:{{ mail_accent }};color:{{ mail_accent_ink }};padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;display:inline-block;">{{ _("View backup") }}</a></p>{% endif %}
{% endblock %}
