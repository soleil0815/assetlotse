{% extends "mail/_layout.html" %}
{% block content %}
<p style="margin:0 0 12px;">{{ _("Hello {name},", name=user.name) }}</p>
<p style="margin:0 0 12px;">{{ _("your account has been approved. You can now sign in with the username <b>{username}</b>.", username=user.username) }}</p>
{% if link %}<p style="margin:20px 0;"><a href="{{ link }}" style="background:{{ mail_accent }};color:{{ mail_accent_ink }};padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;display:inline-block;">{{ _("Go to sign-in") }}</a></p>{% endif %}
{% endblock %}
