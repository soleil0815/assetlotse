# Type check with mypy (python -m mypy) – introduced step by step:
#   - everything is checked, findings in modules that are not strict yet are only listed;
#   - the modules in the [mypy-…] sections below are strict: their findings fail the tests
#     (tests/test_typing.py, also in the check run on GitHub). Add a module once it is clean.
[mypy]
python_version = 3.13
files = assetlotse, scripts, wsgi.py, gunicorn.conf.py
warn_unused_ignores = True
warn_redundant_casts = True

# libraries without type information
[mypy-ldap3.*,segno.*,flask_login.*,flask_wtf.*]
ignore_missing_imports = True

[mypy-assetlotse.backup,assetlotse.netzone,assetlotse.proxy,assetlotse.lockout,ci,lock,eol_check]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_reexport = True
