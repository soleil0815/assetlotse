# AssetLotse – please do not edit this file.
#   Own settings (port, time zone, mail, database …) belong in .env next to it (template: .env.example).
#   Extra folders (e.g. a backup drive) belong in docker-compose.override.yml.
# Updates never touch .env, docker-compose.override.yml or ./data. When a new version needs a newer
# docker-compose.yml, AssetLotse says so; ./update.sh then puts the new file here and keeps this one as
# docker-compose.yml.alt.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d   – or Dockhand, Watchtower, Tugtainer … – or ./update.sh

services:
  assetlotse:
    # latest = always the newest version (incl. the weekly security updates).
    # A fixed version instead: ASSETLOTSE_TAG=2.0.0 in .env
    image: ${ASSETLOTSE_IMAGE:-ghcr.io/soleil0815/assetlotse}:${ASSETLOTSE_TAG:-latest}
    container_name: assetlotse
    restart: unless-stopped
    stop_grace_period: 35s      # let running requests finish (gunicorn waits up to 30 s)
    security_opt:
      - "no-new-privileges:true"  # no privilege gain via setuid programs in the container
    ports:
      # change the port only in .env (ASSETLOTSE_PORT) – the same number applies outside and inside
      - "${ASSETLOTSE_BIND:-0.0.0.0}:${ASSETLOTSE_PORT:-9343}:${ASSETLOTSE_PORT:-9343}"
    volumes:
      - ./data:/data            # database, photos, keys, certificates, backups
    env_file: .env              # your own settings; without entries the defaults apply
    environment:
      ASSETLOTSE_COMPOSE_VERSION: "2"   # version of this file – AssetLotse checks it, please do not change
      ASSETLOTSE_PORT: ${ASSETLOTSE_PORT:-9343}   # the same port inside as outside (see ports)
    logging:                    # limit the log (max. 3 × 10 MB)
      options:
        max-size: "10m"
        max-file: "3"
