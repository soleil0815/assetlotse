# Builds, tests, scans and publishes the AssetLotse image (ghcr.io/<owner>/<repo>) for amd64 and arm64.
# What a run does is decided by scripts/ci.py ("mode"):
#
# Check – every push to main and every pull request: build both architectures from the locked versions,
#   tests in the image (each on its own architecture), Trivy. Nothing is published.
# Release – by hand only (Run workflow → release, on main): the same, and only if everything passed: publish
#   <version>, <minor> and – only for the highest version – latest (one multi-arch image), tag v<version>
#   and a GitHub release with the text from CHANGELOG.md and the installation files (docker-compose.yml,
#   .env.example, update.sh, image files for installing without internet). A published version is never
#   built or pushed again.
# Security update – Mondays 04:17 UTC (or by hand: Run workflow → security-update): scripts/lock.py sets
#   the newest versions WITHIN the base (same Python line, same Debian release, every package within its
#   major version), resolved on an amd64 AND an arm64 machine. Nothing new → nothing happens. Otherwise:
#   build without cache, tests, Trivy, and only if all passed: publish <version>-s<n> (+ <minor>, latest),
#   commit the new lock files with a changelog entry to main, tag v<version>-s<n> and a GitHub release.
# Daily scan – 05:43 UTC: scans the published latest (both architectures) for vulnerabilities that became
#   known after release.
# Base check – Mondays: how long Python and Debian still get security updates (scripts/eol_check.py).
# By hand also: check, relock (set new versions and commit them – to the branch it was started on, no
#   release), scan-latest, eol-check.
#
# Trivy is not a GitHub Action (trivy-action/setup-trivy were compromised in March 2026, CVE-2026-33634):
#   .github/install-trivy.sh loads a fixed version and checks its SHA-256.
# Security of this workflow: actions pinned to commit SHAs, no permissions by default and only what each
#   job needs, no stored git credentials (persist-credentials: false), publishing only from main, one
#   publishing run at a time. Scanners and tests never run in a job that can write.
# A run that stopped halfway is completed by the next one ("repair": floating tags only, nothing rebuilt).
# A red run publishes nothing; GitHub sends an e-mail. The cause is shown as annotations on the run page.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = build, test, scan (nothing published) · release = publish the version on main · security-update · relock = set new versions and commit them to this branch · scan-latest · eol-check"
        type: choice
        options: [check, release, security-update, relock, scan-latest, eol-check]
        default: check
      publish:
        description: "security-update / relock: publish or commit the result (off = trial run)"
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"      # Mondays 04:17 UTC: security update + base check
    - cron: "43 5 * * *"      # daily 05:43 UTC: scan the published image

permissions: {}

concurrency:
  # one WRITING run at a time (release, security update, relock); everything else – checks, pull requests,
  # scans, the base check – runs on its own, so it can never push a waiting release out of the queue
  group: ${{ (github.event.schedule == '17 4 * * 1' || inputs.mode == 'release' || inputs.mode == 'security-update' || inputs.mode == 'relock') && 'docker-release' || format('docker-other-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.m.outputs.kind }}
      build: ${{ steps.m.outputs.build }}
      publish: ${{ steps.m.outputs.publish }}
      scan_latest: ${{ steps.m.outputs.scan_latest }}
      eol: ${{ steps.m.outputs.eol }}
      relock: ${{ steps.m.outputs.relock }}
      lock: ${{ steps.m.outputs.lock }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: m
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/ci.py mode --schedule "$SCHEDULE" --input-mode "$INPUT_MODE" --input-publish "$INPUT_PUBLISH"

  # ------------------------------------------------------------------ new versions (security update, relock)
  # what to resolve against: base image (digest of the multi-arch index) and Debian snapshot – the same for both
  targets:
    needs: mode
    if: needs.mode.outputs.lock == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: python3 scripts/lock.py targets --out "${RUNNER_TEMP}/targets.json" && cat "${RUNNER_TEMP}/targets.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: ${{ runner.temp }}/targets.json
          retention-days: 7

  # every architecture on its own machine: Debian packages and Python packages as they really install there
  resolve:
    needs: targets
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets
          path: ${{ runner.temp }}
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 scripts/lock.py resolve --targets "${RUNNER_TEMP}/targets.json" --out "${RUNNER_TEMP}/resolved-${ARCH}.json"
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["arch"]; sys.exit(0 if a == sys.argv[2] else f"resolved on {a}, expected {sys.argv[2]}")' \
            "${RUNNER_TEMP}/resolved-${ARCH}.json" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-${{ matrix.arch }}
          path: ${{ runner.temp }}/resolved-${{ matrix.arch }}.json
          retention-days: 7

  # ------------------------------------------------------------------ prepare (read only): what to build, which tags
  prepare:
    needs: [mode, targets, resolve]
    if: ${{ !cancelled() && needs.mode.outputs.build == 'true' && needs.targets.result != 'failure' && needs.resolve.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # does the version exist already? existing security-update numbers
    outputs:
      skip: ${{ steps.prep.outputs.skip }}
      version: ${{ steps.prep.outputs.version }}
      name: ${{ steps.prep.outputs.name }}
      tags: ${{ steps.prep.outputs.tags }}
      create_tag: ${{ steps.prep.outputs.create_tag }}
      image: ${{ steps.prep.outputs.image }}
      publish: ${{ needs.mode.outputs.publish == 'true' && steps.prep.outputs.skip != 'true' }}
      repair: ${{ needs.mode.outputs.publish == 'true' && steps.prep.outputs.repair == 'true' }}
      repair_source: ${{ steps.reg.outputs.repair_source }}
      repair_tags: ${{ steps.reg.outputs.repair_tags }}
      repair_release: ${{ steps.reg.outputs.release_missing == 'true' && steps.reg.outputs.newest || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # all tags: highest version, unreleased changes, numbers
          persist-credentials: false

      - if: needs.mode.outputs.lock == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets
          path: ${{ runner.temp }}/lock
      - if: needs.mode.outputs.lock == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: resolved-*
          merge-multiple: true
          path: ${{ runner.temp }}/lock

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # what is published already – the only step with a token; fails closed (an error never means "missing")
      - name: Registry state
        id: reg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' assetlotse/__init__.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No valid __version__ in assetlotse/__init__.py"; exit 1; }
          git tag -l > "${RUNNER_TEMP}/git-tags.txt"
          python3 scripts/ci.py registry-state --image "ghcr.io/${GITHUB_REPOSITORY,,}" --version "$version" \
            --git-tags "${RUNNER_TEMP}/git-tags.txt" --tags-out "${RUNNER_TEMP}/registry-tags.txt"

      - name: Prepare
        id: prep
        env:
          KIND: ${{ needs.mode.outputs.kind }}
          VERSION_EXISTS: ${{ steps.reg.outputs.version_exists }}
          REPAIR_TAGS: ${{ steps.reg.outputs.repair_tags }}
          RELEASE_MISSING: ${{ steps.reg.outputs.release_missing }}
          NEWEST: ${{ steps.reg.outputs.newest }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' assetlotse/__init__.py)"
          grep -q "org.opencontainers.image.version=\"${version}\"" Dockerfile \
            || { echo "::error::Dockerfile LABEL org.opencontainers.image.version is not ${version}"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          { echo "version=${version}"; echo "name=${version}"; echo "image=${image}"; echo "create_tag=false"; echo "repair=false"; } >> "$GITHUB_OUTPUT"
          repair() {   # a previous run stopped halfway: move <minor>/latest, add the release page – rebuild nothing
            echo "::notice title=Repair::a previous run stopped halfway (${REPAIR_TAGS:-release page of v${NEWEST} missing}) – completed in this run, nothing is rebuilt"
            { echo "repair=true"; echo "skip=true"; } >> "$GITHUB_OUTPUT"; exit 0
          }
          incomplete() { [ -n "$REPAIR_TAGS" ] || [ "$RELEASE_MISSING" = true ]; }

          if [ "$KIND" = release ]; then
            if [ "$VERSION_EXISTS" = true ]; then
              ! incomplete || repair
              echo "::notice::${version} is already published – nothing to build (raise the version to release)."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              [ "$(git rev-parse "v${version}^{commit}")" = "$(git rev-parse HEAD)" ] \
                || { echo "::error title=Release::tag v${version} points to another commit – raise the version number"; exit 1; }
            else
              echo "create_tag=true" >> "$GITHUB_OUTPUT"
            fi
            python3 scripts/ci.py plan-release --image "$image" --version "$version" --git-tags "${RUNNER_TEMP}/git-tags.txt"
            # never older packages than the newest published build (e.g. after unpacking an older copy over main)
            previous="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import ci
          t = open(sys.argv[1]).read().split(); h = ci.highest_release(t); print(ci.expected_build(h, t) if h else "")' "${RUNNER_TEMP}/git-tags.txt")"
            if [ -n "$previous" ]; then
              python3 scripts/lock.py not-older --than "v${previous}"
              if [ "$previous" != "${previous%-s*}" ] && ! grep -q "^## ${previous} " CHANGELOG.md; then
                echo "::error title=Release::CHANGELOG.md lacks the entry of the security update ${previous} – merge the newest main (git pull) and push again"; exit 1
              fi
            fi

          elif [ "$KIND" = security ]; then
            ! incomplete || repair
            # same program as the release: only lock files, changelog, docs, tests and CI may differ
            git rev-parse -q --verify "refs/tags/v${version}" >/dev/null && [ "$VERSION_EXISTS" = true ] \
              || { echo "::error title=Security update::${version} is not released yet – release it first (Run workflow → release)"; exit 1; }
            changed="$(git diff --name-only "v${version}" HEAD -- . ':(exclude)requirements.txt' \
              ':(exclude)build/debian-packages.lock' ':(exclude)build/debian-packages.arm64.lock' \
              ':(exclude)CHANGELOG.md' ':(exclude)README.md' \
              ':(exclude)README.en.md' ':(exclude)docs' ':(exclude)tests' ':(exclude)scripts' \
              ':(exclude).github' ':(exclude)Dockerfile' ':(exclude).trivyignore' ':(exclude).gitignore')"
            if ! diff -q <(git show "v${version}:Dockerfile" | grep -vE '^ARG (PYTHON_IMAGE|PIP_VERSION)=') \
                         <(grep -vE '^ARG (PYTHON_IMAGE|PIP_VERSION)=' Dockerfile) >/dev/null; then
              changed="${changed} Dockerfile"
            fi
            if [ -n "${changed// /}" ]; then
              echo "::error title=Security update::main has unreleased program changes since v${version}: $(echo $changed) – release them first (Run workflow → release with a new version number)"
              exit 1
            fi
            lock="${RUNNER_TEMP}/lock"
            python3 scripts/lock.py apply --targets "$lock/targets.json" --resolved "$lock/resolved-amd64.json" \
              --resolved "$lock/resolved-arm64.json" --report "${RUNNER_TEMP}/refresh.json"
            # compared with what is PUBLISHED (also catches versions committed by "relock" but not released yet)
            published="v$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import ci; print(ci.expected_build(sys.argv[1], open(sys.argv[2]).read().split()))' "$version" "${RUNNER_TEMP}/git-tags.txt")"
            python3 scripts/lock.py changes --since "$published" --report "${RUNNER_TEMP}/changes.json"
            if [ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["changed"])' "${RUNNER_TEMP}/changes.json")" != True ]; then
              echo "::notice title=Security update::No new versions within the base since ${published} – nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # numbers already used in the registry count too (a run may have stopped halfway)
            plan="$(python3 scripts/ci.py plan-security --image "$image" --version "$version" \
              --git-tags "${RUNNER_TEMP}/git-tags.txt" --registry-tags "${RUNNER_TEMP}/registry-tags.txt")"
            name="$(sed -n 's/^name=//p' <<< "$plan")"
            python3 scripts/ci.py changelog --name "$name" --version "$version" --report "${RUNNER_TEMP}/changes.json" \
              > "${RUNNER_TEMP}/entry.md"
            git diff --binary > "${RUNNER_TEMP}/security.patch"
            mkdir -p "${RUNNER_TEMP}/security-update"
            cp "${RUNNER_TEMP}/changes.json" "${RUNNER_TEMP}/security.patch" "${RUNNER_TEMP}/entry.md" "${RUNNER_TEMP}/security-update/"
            { echo "### Security update ${name}"; cat "${RUNNER_TEMP}/entry.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/lock.py check \
            || { echo "::error title=Lock files::not consistent (details in the log) – set the versions with Run workflow → relock"; exit 1; }
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.prep.outputs.skip != 'true' && needs.mode.outputs.kind == 'security'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-update
          path: ${{ runner.temp }}/security-update/
          retention-days: 7

  # ------------------------------------------------------------------ build (read only), each on its own architecture
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - if: needs.prepare.outputs.name != needs.prepare.outputs.version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-update
          path: ${{ runner.temp }}/security-update

      - name: Apply the new versions (security update)
        run: |
          p="${RUNNER_TEMP}/security-update/security.patch"
          [ ! -f "$p" ] || git apply "$p"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (not published yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          no-cache: true          # always from scratch: exactly the locked versions, nothing cached
          pull: true
          provenance: false       # one plain image per architecture; the index is made when publishing
          outputs: type=docker,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.name }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.assetlotse.build=${{ needs.prepare.outputs.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 1

  # ------------------------------------------------------------------ tests in the image (read only), on its own architecture
  test:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/image

      - if: needs.prepare.outputs.name != needs.prepare.outputs.version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-update
          path: ${{ runner.temp }}/artifacts/security-update

      - name: Apply the new versions (security update)
        run: |
          p="${RUNNER_TEMP}/artifacts/security-update/security.patch"
          [ ! -f "$p" ] || git apply "$p"

      - name: Tests in the image
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.name }}
        run: |
          set -uo pipefail
          docker load -q -i "${RUNNER_TEMP}/artifacts/image/image-${ARCH}.tar"
          [ "$(docker image inspect -f '{{.Architecture}}' "$REF")" = "$ARCH" ] \
            || { echo "::error title=Tests::the image is not ${ARCH}"; exit 1; }
          # pytest stays outside the image: installed here (exact versions) and mounted read-only
          python3 -m pip install -q --no-deps --only-binary=:all: --break-system-packages \
            --target "${RUNNER_TEMP}/pytest" -r tests/requirements-test.txt
          # type check (tests/test_typing.py) once, on amd64: mypy for Python 3.13 on this CPU, also mounted read-only
          typing=()
          if [ "$ARCH" = amd64 ]; then
            python3 -m pip install -q --no-deps --only-binary=:all: --break-system-packages --target "${RUNNER_TEMP}/typing" \
              --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --abi none \
              --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 \
              -r tests/requirements-typing.txt
            typing=(-v "${RUNNER_TEMP}/typing:/opt/typing:ro" -e ASSETLOTSE_REQUIRE_MYPY=1)
          fi
          rc=0
          : > selftest.log
          if [ "$ARCH" = amd64 ]; then
            # the self-tests of the build chain need tools of the runner (jq, bash) – they run here once, all others in the image
            PYTHONPATH="${RUNNER_TEMP}/pytest" python3 -m pytest -q -p no:cacheprovider --noconftest -rfE tests/test_supply_chain.py \
              > selftest.log 2>&1 || rc=$?
          fi
          docker run --rm -v "$PWD:/src" -w /src -v "${RUNNER_TEMP}/pytest:/opt/pytest:ro" "${typing[@]}" \
            -e PYTHONPATH=/opt/pytest:/opt/typing --entrypoint python "$REF" -m pytest -q -p no:cacheprovider -rfE \
            --ignore=tests/test_supply_chain.py tests > pytest.log 2>&1 || rc=$?
          summary="${ARCH} in the image: $(tail -n 1 pytest.log)"
          [ ! -s selftest.log ] || summary="${summary} · build chain: $(tail -n 1 selftest.log)"
          cat selftest.log >> pytest.log
          cat pytest.log
          { echo "### Tests in the image (${ARCH})"; echo '```'; tail -n 25 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            grep -E '^(FAILED|ERROR|E  )' pytest.log | head -n 20 | while IFS= read -r line; do echo "::error title=Test (${ARCH})::${line}"; done
            echo "::error title=Tests failed::${summary} – nothing is published"
            exit "$rc"
          fi
          echo "::notice title=Tests::${summary}"

  # ------------------------------------------------------------------ Trivy (read only) – reads the image files, any machine
  scan:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Install Trivy (fixed version, SHA-256 checked)
        run: |
          .github/install-trivy.sh "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "$GITHUB_PATH"

      - name: Trivy scan
        env:
          CONSEQUENCE: nothing is published
          NAME: ${{ needs.prepare.outputs.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          .github/trivy-scan.sh "${RUNNER_TEMP}/image-${ARCH}.tar" "Trivy – ${NAME} ${ARCH} (HIGH/CRITICAL with a fix)"

  # ------------------------------------------------------------------ publish (write) – only if everything passed
  publish:
    needs: [prepare, build, test, scan]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' && needs.test.result == 'success' && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write          # release tag and page; security update: commit of the lock files + tag
      packages: write
    timeout-minutes: 30
    env:
      KIND: ${{ needs.prepare.outputs.name != needs.prepare.outputs.version && 'security' || 'release' }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NAME: ${{ needs.prepare.outputs.name }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - if: env.KIND == 'security'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-update
          path: ${{ runner.temp }}/artifacts/security-update

      # security update: only the lock files and the changelog may change – checked before anything is written
      - name: Check the changes
        if: env.KIND == 'security'
        run: |
          git apply "${RUNNER_TEMP}/artifacts/security-update/security.patch"
          python3 scripts/ci.py check-changes

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # image config per architecture from the archives themselves (the tested images, nothing rebuilt)
          config_of() { tar -xOf "$1" manifest.json | python3 -c \
            'import json,sys; c=json.load(sys.stdin)[0]["Config"]; print("sha256:" + c.rsplit("/", 1)[-1].removesuffix(".json"))'; }
          local_state="$(for a in amd64 arm64; do echo "$a $(config_of "${RUNNER_TEMP}/images/image-${a}.tar")"; done)"
          first="${IMAGE}:${NAME}"                  # <version> or <version>-s<n> – never overwritten
          state="$(python3 scripts/ci.py registry-platforms --image "$IMAGE" --tag "$NAME")"
          pushed=false
          if [ "$state" = "$local_state" ]; then      # "Re-run failed jobs" after a step further down failed
            echo "::notice title=Publish::${first} was already pushed by an earlier attempt of this run – continuing"
            pushed=true
          elif [ "$state" != missing ]; then
            echo "::error title=Publish::${first} exists already with another image – a published version is never overwritten (raise the version number)"; exit 1
          fi
          push_image() {   # one image per architecture (<name>-<arch>), then the multi-arch index <name>
            for a in amd64 arm64; do
              docker load -q -i "${RUNNER_TEMP}/images/image-${a}.tar"
              docker tag "$first" "${first}-${a}"
              docker push -q "${first}-${a}"
            done
            docker buildx imagetools create --tag "$first" "${first}-amd64" "${first}-arm64"
          }
          # git: credentials only for these commands, never stored
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c http.https://github.com/.extraheader="$auth" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$KIND" = release ]; then
            # tag first: if a later step fails, the next run resumes (the image is still missing, the tag is right)
            if [ "$CREATE_TAG" = true ]; then
              git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null || git tag "v${VERSION}" "${GITHUB_SHA}"
              git_auth push origin "refs/tags/v${VERSION}"
            fi
            [ "$pushed" = true ] || push_image
          elif [ -n "$(git_auth ls-remote --tags origin "refs/tags/v${NAME}")" ]; then
            echo "::notice title=Publish::v${NAME} is already committed and tagged – continuing with the floating tags"
          else
            # main must still be where this run started – checked BEFORE the image is pushed
            [ "$(git_auth ls-remote origin refs/heads/main | cut -f1)" = "${GITHUB_SHA}" ] \
              || { echo "::error title=Security update::main changed while this run was going – nothing published; the next run (Monday or by hand) repeats it"; exit 1; }
            [ "$pushed" = true ] || push_image
            git commit -q -am "Sicherheitsupdate ${NAME}: aktualisierte Pakete (gleiches Programm wie ${VERSION})"
            git tag "v${NAME}"
            git_auth push --atomic origin HEAD:refs/heads/main "refs/tags/v${NAME}"
          fi
          IFS=, read -ra tags <<< "$TAGS"
          for t in "${tags[@]:1}"; do              # <minor> and latest (latest only for the highest version)
            docker buildx imagetools create --tag "$t" "$first"
          done
          echo "::notice title=Published::${TAGS//,/, } (amd64, arm64)"

      # the release page on GitHub (tag v<name>, text from CHANGELOG.md, installation files) – after the image
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "v${NAME}" >/dev/null 2>&1; then
            echo "::notice title=Release::v${NAME} exists already"; exit 0
          fi
          python3 scripts/ci.py release-notes --name "$NAME" --image "${IMAGE}:${NAME}" > "${RUNNER_TEMP}/notes.md"
          assets="${RUNNER_TEMP}/assets"; mkdir -p "$assets"
          # GitHub renames uploads that start with a dot – the template goes up as env.example
          cp docker-compose.yml update.sh "$assets/"; cp .env.example "$assets/env.example"
          files=("$assets/docker-compose.yml" "$assets/env.example" "$assets/update.sh")
          for a in amd64 arm64; do               # for installing without internet: ./update.sh --offline <file>
            f="assetlotse-${NAME}-${a}.tar.gz"
            gzip -c "${RUNNER_TEMP}/images/image-${a}.tar" > "$assets/$f"
            (cd "$assets" && sha256sum "$f" > "$f.sha256")
            files+=("$assets/$f" "$assets/$f.sha256")
          done
          latest=false
          [[ ",${TAGS}," != *":latest,"* ]] || latest=true          # marked "Latest" only for the highest version
          title="AssetLotse ${NAME}"
          [ "$KIND" != security ] || title="${title} (Sicherheitsupdate)"
          gh release create "v${NAME}" --verify-tag --title "$title" --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest="$latest" "${files[@]}"
          echo "::notice title=Release::${title}"

  # a run that stopped halfway: point <minor>/latest to the newest build and add a missing release page
  # (nothing is rebuilt)
  repair:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.repair == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write          # create a missing GitHub release
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the floating tags
        if: needs.prepare.outputs.repair_tags != ''
        env:
          SOURCE: ${{ needs.prepare.outputs.repair_source }}
          REPAIR_TAGS: ${{ needs.prepare.outputs.repair_tags }}
        run: |
          set -euo pipefail
          IFS=, read -ra tags <<< "$REPAIR_TAGS"
          for t in "${tags[@]}"; do
            docker buildx imagetools create --tag "$t" "$SOURCE"
          done
          echo "::notice title=Repair::${REPAIR_TAGS//,/, } → ${SOURCE}"
      - name: Missing GitHub release
        if: needs.prepare.outputs.repair_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.prepare.outputs.repair_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/ci.py release-notes --name "$NAME" --image "${image}:${NAME}" > "${RUNNER_TEMP}/notes.md"
          # the installation files as they were at that version; the image files from the registry
          assets="${RUNNER_TEMP}/assets"; mkdir -p "$assets"
          files=()
          for f in docker-compose.yml .env.example update.sh; do
            git show "v${NAME}:$f" > "$assets/${f#.}"; files+=("$assets/${f#.}")     # .env.example → env.example
          done
          for a in amd64 arm64; do
            f="assetlotse-${NAME}-${a}.tar.gz"
            docker pull -q --platform "linux/${a}" "${image}:${NAME}"
            docker save "${image}:${NAME}" | gzip > "$assets/$f"
            (cd "$assets" && sha256sum "$f" > "$f.sha256")
            files+=("$assets/$f" "$assets/$f.sha256")
            docker image rm "${image}:${NAME}" >/dev/null
          done
          highest="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import ci; print(ci.highest_release(sys.stdin.read().split()))' <<< "$(git tag -l)")"
          latest=false; [ "$highest" != "$VERSION" ] || latest=true
          title="AssetLotse ${NAME}"; [ "$NAME" = "$VERSION" ] || title="${title} (Sicherheitsupdate)"
          gh release create "v${NAME}" --verify-tag --title "$title" --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest="$latest" "${files[@]}"
          echo "::notice title=Repair::release page ${title} created"

  # ------------------------------------------------------------------ relock: set new versions, commit (no release)
  relock:
    needs: [mode, targets, resolve]
    if: needs.mode.outputs.relock == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets
          path: ${{ runner.temp }}/lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: resolved-*
          merge-multiple: true
          path: ${{ runner.temp }}/lock
      - name: scripts/lock.py apply
        id: lock
        run: |
          set -euo pipefail
          lock="${RUNNER_TEMP}/lock"
          python3 scripts/lock.py apply --targets "$lock/targets.json" --resolved "$lock/resolved-amd64.json" \
            --resolved "$lock/resolved-arm64.json" --report changes.json
          python3 scripts/lock.py check
          if git diff --quiet; then
            echo "::notice title=Relock::No new versions – nothing changed."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --binary > relock.patch
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relock
          path: |
            relock.patch
            changes.json
          retention-days: 7

  relock-commit:
    needs: [mode, relock]
    if: needs.mode.outputs.publish == 'true' && needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relock
          path: ${{ runner.temp }}
      - name: Commit the new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git apply "${RUNNER_TEMP}/relock.patch"
          python3 scripts/ci.py check-changes          # only lock files – checked before anything is written
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Versionen neu festgelegt (scripts/lock.py)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # to the branch the run was started on (main, or the branch of a pull request)
          git -c http.https://github.com/.extraheader="$auth" push origin "HEAD:${GITHUB_REF}"
          echo "::notice title=Relock::committed to ${GITHUB_REF#refs/heads/} – tested with the next check, published with the next release or security update"

  # ------------------------------------------------------------------ daily scan of the published image (read only)
  scan-latest:
    needs: mode
    if: needs.mode.outputs.scan_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull, save, log out: the scanner works on the files and never sees the registry login
      - name: Pull latest
        id: img
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          for a in amd64 arm64; do
            if ! docker pull -q --platform "linux/${a}" "$ref"; then
              # releases before 2.0.0 were amd64 only
              [ "$a" = arm64 ] || exit 1
              echo "::notice title=Daily scan::latest has no ${a} image yet – scanned amd64 only"; continue
            fi
            docker save -o "${RUNNER_TEMP}/latest-${a}.tar" "$ref"
            [ "$a" != amd64 ] || echo "build=$(docker inspect -f '{{ index .Config.Labels "io.assetlotse.build" }}' "$ref")" >> "$GITHUB_OUTPUT"
            docker image rm "$ref" >/dev/null
          done
          docker logout ghcr.io

      - name: Install Trivy (fixed version, SHA-256 checked)
        run: |
          .github/install-trivy.sh "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "$GITHUB_PATH"

      - name: Trivy scan of latest
        env:
          CONSEQUENCE: "new since the release – the next security update (Mondays) usually fixes it; otherwise see README"
          BUILD: ${{ steps.img.outputs.build }}
        run: |
          rc=0
          for a in amd64 arm64; do
            [ -f "${RUNNER_TEMP}/latest-${a}.tar" ] || continue
            .github/trivy-scan.sh "${RUNNER_TEMP}/latest-${a}.tar" "Trivy – latest ${a} (${BUILD:-unknown})" || rc=1
          done
          exit "$rc"

  # ------------------------------------------------------------------ base check (read only)
  eol:
    needs: mode
    if: needs.mode.outputs.eol == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: How long do Python and Debian still get security updates?
        run: python3 scripts/eol_check.py
