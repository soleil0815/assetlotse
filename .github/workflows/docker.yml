# Builds, tests, scans and publishes the AssetLotse image (ghcr.io/<owner>/<repo>). What a run does is
# decided by scripts/ci.py ("mode"):
#
# New program version – push to master with a new version in assetlotse/__init__.py: build from the
#   locked versions, tests in the image, Trivy, then publish <version>, <minor> and – only for the highest
#   version – latest, and create the tag v<version>. A version that exists is never built or pushed again.
# Security update – Mondays 04:17 UTC (or by hand: Run workflow → security-update): scripts/lock.py sets
#   the newest versions WITHIN the base (same Python line, same Debian release, every package within its
#   major version). Nothing new → nothing happens. Otherwise: build without cache, tests, Trivy, and only
#   if all passed: publish <version>-s<n> (+ <minor>, latest), commit the new lock files with a changelog
#   entry to master and tag v<version>-s<n>.
# Daily scan – 05:43 UTC: scans the published latest for vulnerabilities that became known after release.
# Base check – Mondays: how long Python and Debian still get security updates (scripts/eol_check.py).
# By hand also: check (build, test, scan – nothing published), relock (set new versions, commit them
#   without release), scan-latest, eol-check.
#
# Trivy is not a GitHub Action (trivy-action/setup-trivy were compromised in March 2026, CVE-2026-33634):
#   .github/install-trivy.sh loads a fixed version and checks its SHA-256.
# Security of this workflow: actions pinned to commit SHAs, no permissions by default and only what each
#   job needs, no stored git credentials (persist-credentials: false), publishing only from master, one
#   release run at a time. Scanners and tests never run in a job that can write.
# A red run publishes nothing; GitHub sends an e-mail. The cause is shown as annotations on the run page.
name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = build, test, scan (nothing published) · security-update · relock = set new versions and commit · scan-latest · eol-check"
        type: choice
        options: [check, security-update, relock, scan-latest, eol-check]
        default: check
      publish:
        description: "security-update / relock: publish or commit the result (off = trial run)"
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"      # Mondays 04:17 UTC: security update + base check
    - cron: "43 5 * * *"      # daily 05:43 UTC: scan the published image

permissions: {}

concurrency:
  # one release run at a time; scans and the base check do not publish and run separately
  group: ${{ (github.event.schedule == '43 5 * * *' || inputs.mode == 'scan-latest' || inputs.mode == 'eol-check') && 'docker-scan' || 'docker-release' }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.m.outputs.kind }}
      build: ${{ steps.m.outputs.build }}
      publish: ${{ steps.m.outputs.publish }}
      scan_latest: ${{ steps.m.outputs.scan_latest }}
      eol: ${{ steps.m.outputs.eol }}
      relock: ${{ steps.m.outputs.relock }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: m
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/ci.py mode --schedule "$SCHEDULE" --input-mode "$INPUT_MODE" --input-publish "$INPUT_PUBLISH"

  # ------------------------------------------------------------------ build (read only)
  build:
    needs: mode
    if: needs.mode.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # does the version exist already? existing security-update numbers
    outputs:
      skip: ${{ steps.prep.outputs.skip }}
      version: ${{ steps.prep.outputs.version }}
      name: ${{ steps.prep.outputs.name }}
      tags: ${{ steps.prep.outputs.tags }}
      create_tag: ${{ steps.prep.outputs.create_tag }}
      publish: ${{ needs.mode.outputs.publish == 'true' && steps.prep.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # all tags: highest version, unreleased changes, numbers
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        id: prep
        env:
          KIND: ${{ needs.mode.outputs.kind }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' assetlotse/__init__.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No valid __version__ in assetlotse/__init__.py"; exit 1; }
          grep -q "org.opencontainers.image.version=\"${version}\"" Dockerfile \
            || { echo "::error::Dockerfile LABEL org.opencontainers.image.version is not ${version}"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          git tag -l > "${RUNNER_TEMP}/git-tags.txt"
          { echo "version=${version}"; echo "name=${version}"; echo "create_tag=false"; } >> "$GITHUB_OUTPUT"

          if [ "$KIND" = release ]; then
            if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
              echo "::notice::${version} is already published – nothing to build (raise the version to release)."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            python3 scripts/ci.py plan-release --image "$image" --version "$version" --git-tags "${RUNNER_TEMP}/git-tags.txt"
            git rev-parse -q --verify "refs/tags/v${version}" >/dev/null || echo "create_tag=true" >> "$GITHUB_OUTPUT"

          elif [ "$KIND" = security ]; then
            # same program as the release: only lock files, changelog, docs, tests and CI may differ
            git rev-parse -q --verify "refs/tags/v${version}" >/dev/null \
              || { echo "::error title=Security update::v${version} is not released yet – push a new version first"; exit 1; }
            changed="$(git diff --name-only "v${version}" HEAD -- . ':(exclude)requirements.txt' \
              ':(exclude)build/debian-packages.lock' ':(exclude)CHANGELOG.md' ':(exclude)README.md' \
              ':(exclude)README.en.md' ':(exclude)docs' ':(exclude)tests' ':(exclude)scripts' \
              ':(exclude).github' ':(exclude)Dockerfile')"
            if ! diff -q <(git show "v${version}:Dockerfile" | grep -vE '^ARG (PYTHON_IMAGE|PIP_VERSION)=') \
                         <(grep -vE '^ARG (PYTHON_IMAGE|PIP_VERSION)=' Dockerfile) >/dev/null; then
              changed="${changed} Dockerfile"
            fi
            if [ -n "${changed// /}" ]; then
              echo "::error title=Security update::master has unreleased program changes since v${version}: $(echo $changed) – release them as a new version first (raise the version number)"
              exit 1
            fi
            python3 scripts/lock.py refresh --report "${RUNNER_TEMP}/changes.json"
            if git diff --quiet; then
              echo "::notice title=Security update::No new versions within the base – nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # numbers already used in the registry count too (a run may have stopped halfway)
            token="$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            curl -fsS -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/tags/list?n=10000" \
              | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin).get("tags") or []))' > "${RUNNER_TEMP}/registry-tags.txt"
            plan="$(python3 scripts/ci.py plan-security --image "$image" --version "$version" \
              --git-tags "${RUNNER_TEMP}/git-tags.txt" --registry-tags "${RUNNER_TEMP}/registry-tags.txt")"
            name="$(sed -n 's/^name=//p' <<< "$plan")"
            python3 scripts/ci.py changelog --name "$name" --version "$version" --report "${RUNNER_TEMP}/changes.json" \
              > "${RUNNER_TEMP}/entry.md"
            git diff --binary > "${RUNNER_TEMP}/security.patch"
            cp "${RUNNER_TEMP}/changes.json" "${RUNNER_TEMP}/security.patch" "${RUNNER_TEMP}/entry.md" .
            { echo "### Security update ${name}"; cat "${RUNNER_TEMP}/entry.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/lock.py check \
            || { echo "::error title=Lock files::not consistent (details in the log) – set the versions with Run workflow → relock"; exit 1; }
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build (not published yet)
        id: build
        if: steps.prep.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          no-cache: true          # always from scratch: exactly the locked versions, nothing cached
          pull: true
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: assetlotse:scan
          labels: |
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.assetlotse.build=${{ steps.prep.outputs.name }}

      - if: steps.prep.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

      - if: steps.prep.outputs.skip != 'true' && needs.mode.outputs.kind == 'security'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-update
          path: |
            security.patch
            changes.json
            entry.md
          retention-days: 7

  # ------------------------------------------------------------------ tests in the image (read only)
  test:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Apply the new versions (security update)
        run: |
          p="${RUNNER_TEMP}/artifacts/security-update/security.patch"
          [ ! -f "$p" ] || git apply "$p"

      - name: Tests in the image
        run: |
          set -uo pipefail
          docker load -q -i "${RUNNER_TEMP}/artifacts/image/image.tar"
          # pytest stays outside the image: installed here (exact versions) and mounted read-only
          python3 -m pip install -q --no-deps --only-binary=:all: --break-system-packages \
            --target "${RUNNER_TEMP}/pytest" -r tests/requirements-test.txt
          rc=0
          docker run --rm -v "$PWD:/src" -w /src -v "${RUNNER_TEMP}/pytest:/opt/pytest:ro" -e PYTHONPATH=/opt/pytest \
            --entrypoint python assetlotse:scan -m pytest -q -p no:cacheprovider -rfE tests > pytest.log 2>&1 || rc=$?
          cat pytest.log
          { echo "### Tests in the image"; echo '```'; tail -n 25 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            grep -E '^(FAILED|ERROR|E  )' pytest.log | head -n 20 | while IFS= read -r line; do echo "::error title=Test::${line}"; done
            echo "::error title=Tests failed::exit code ${rc} – $(tail -n 1 pytest.log) – nothing is published"
            exit "$rc"
          fi
          echo "::notice title=Tests::$(tail -n 1 pytest.log)"

  # ------------------------------------------------------------------ Trivy (read only)
  scan:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Install Trivy (fixed version, SHA-256 checked)
        run: |
          .github/install-trivy.sh "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "$GITHUB_PATH"

      - name: Trivy scan
        env:
          CONSEQUENCE: nothing is published
          NAME: ${{ needs.build.outputs.name }}
        run: |
          .github/trivy-scan.sh "${RUNNER_TEMP}/image.tar" "Trivy – ${NAME} (HIGH/CRITICAL with a fix)"

  # ------------------------------------------------------------------ publish (write) – only if everything passed
  publish:
    needs: [build, test, scan]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # release tag; security update: commit of the lock files + tag
      packages: write
    env:
      KIND: ${{ needs.build.outputs.name != needs.build.outputs.version && 'security' || 'release' }}
      VERSION: ${{ needs.build.outputs.version }}
      NAME: ${{ needs.build.outputs.name }}
      TAGS: ${{ needs.build.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load -q -i "${RUNNER_TEMP}/artifacts/image/image.tar"
          IFS=, read -ra tags <<< "$TAGS"
          first="${tags[0]}"                       # <version> or <version>-s<n> – never overwritten
          if docker buildx imagetools inspect "$first" >/dev/null 2>&1; then
            echo "::error title=Publish::${first} exists already – a published version is never overwritten"; exit 1
          fi
          docker tag assetlotse:scan "$first"
          docker push -q "$first"
          # git: credentials only for this one command, never stored
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$KIND" = security ]; then
            git apply "${RUNNER_TEMP}/artifacts/security-update/security.patch"
            git commit -q -am "Sicherheitsupdate ${NAME}: aktualisierte Pakete (gleiches Programm wie ${VERSION})"
            git tag "v${NAME}"
            # fails if master moved on meanwhile – then latest stays unchanged and the next run repeats it
            git -c http.https://github.com/.extraheader="$auth" push --atomic origin HEAD:refs/heads/master "refs/tags/v${NAME}"
          elif [ "${{ needs.build.outputs.create_tag }}" = true ]; then
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git -c http.https://github.com/.extraheader="$auth" push origin "refs/tags/v${VERSION}"
          fi
          for t in "${tags[@]:1}"; do              # <minor> and latest (latest only for the highest version)
            docker tag assetlotse:scan "$t"
            docker push -q "$t"
          done
          echo "::notice title=Published::${TAGS//,/, }"

  # ------------------------------------------------------------------ relock: set new versions, commit (no release)
  relock:
    needs: mode
    if: needs.mode.outputs.relock == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: scripts/lock.py refresh
        id: lock
        run: |
          set -euo pipefail
          python3 scripts/lock.py refresh --report changes.json
          python3 scripts/lock.py check
          if git diff --quiet; then
            echo "::notice title=Relock::No new versions – nothing changed."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --binary > relock.patch
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relock
          path: |
            relock.patch
            changes.json
          retention-days: 7

  relock-commit:
    needs: [mode, relock]
    if: needs.mode.outputs.publish == 'true' && needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relock
          path: ${{ runner.temp }}
      - name: Commit the new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git apply "${RUNNER_TEMP}/relock.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Versionen neu festgelegt (scripts/lock.py)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" push origin HEAD:refs/heads/master
          echo "::notice title=Relock::committed – tested and published with the next version"

  # ------------------------------------------------------------------ daily scan of the published image (read only)
  scan-latest:
    needs: mode
    if: needs.mode.outputs.scan_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull, save, log out: the scanner works on the file and never sees the registry login
      - name: Pull latest
        id: img
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull -q "$ref"
          docker save -o "${RUNNER_TEMP}/latest.tar" "$ref"
          docker logout ghcr.io
          echo "build=$(docker inspect -f '{{ index .Config.Labels "io.assetlotse.build" }}' "$ref")" >> "$GITHUB_OUTPUT"

      - name: Install Trivy (fixed version, SHA-256 checked)
        run: |
          .github/install-trivy.sh "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "$GITHUB_PATH"

      - name: Trivy scan of latest
        env:
          CONSEQUENCE: "new since the release – the next security update (Mondays) usually fixes it; otherwise see README"
          BUILD: ${{ steps.img.outputs.build }}
        run: |
          .github/trivy-scan.sh "${RUNNER_TEMP}/latest.tar" "Trivy – latest (${BUILD:-unknown})"

  # ------------------------------------------------------------------ base check (read only)
  eol:
    needs: mode
    if: needs.mode.outputs.eol == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: How long do Python and Debian still get security updates?
        run: python3 scripts/eol_check.py
