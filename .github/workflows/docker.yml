# Builds the AssetLotse image on GitHub and publishes it to ghcr.io/<owner>/<repo>.
#
# Release – automatic: push to master with a new version in assetlotse/__init__.py. If there is no tag
#   v<version> yet, the image is built (tags <version>, <minor> and – if it is the highest release –
#   "latest") and the tag v<version> is created. Pushes without a new version build nothing.
# Release – by hand (still works): git tag v1.9.0 && git push origin v1.9.0
# Test: Actions → Docker image → Run workflow → tag "test-<commit>" (release tags stay untouched).
#
# Security scan: every image is checked with Trivy BEFORE it is pushed. Known HIGH or CRITICAL vulnerabilities
#   that already have a fix (Debian packages and Python packages) stop the release – nothing is published,
#   "latest" stays on the previous version. Fix: update the base image digest or the package in
#   requirements.txt, raise the version, push again. A deliberate exception goes into .trivyignore.
# Weekly check: every Monday "latest" is scanned again, because new vulnerabilities are found in old images.
#   A failed run means: build a new version (GitHub sends an e-mail when a run fails).
# Jobs: build (read only) → scan (read only, the scanner never sees write access or registry login)
#   → publish (write access, pushes exactly the scanned image and creates the tag).
#
# On the server:  ./update.sh --pull   (see README, "Ready-made images from GitHub")
# Actions are pinned to commit SHAs (the comment shows the version) – update them deliberately.
name: Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"      # Mondays 05:17 UTC: scan "latest" for newly found vulnerabilities

permissions: {}           # every job states what it needs

concurrency:
  group: ${{ github.event_name == 'schedule' && 'docker-scan' || 'docker-release' }}   # one release at a time
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.75.0

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # check whether the version is already published
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # all tags, to decide whether this release becomes "latest"
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and tags
        id: meta
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' assetlotse/__init__.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No valid __version__ in assetlotse/__init__.py"; exit 1; }
          grep -q "org.opencontainers.image.version=\"${version}\"" Dockerfile \
            || { echo "::error::Dockerfile LABEL org.opencontainers.image.version is not ${version}"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            # released = the image exists in the registry (a tag alone is not enough, e.g. after a failed build)
            if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
              echo "::notice::${version} is already published – nothing to build (raise the version to release)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          create_tag=false
          if [ "${GITHUB_REF_TYPE}" = branch ] && [ "$release" = true ] && ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            create_tag=true
          fi
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} (expected v${version})"; exit 1
            fi
            tags="${image}:${version}"
            # the minor tag (e.g. 1.9) only moves forward within its line
            minor="${version%.*}"
            highest_minor="$( { git tag -l "v${minor}.[0-9]*" | sed 's/^v//'; echo "$version"; } | sort -V | tail -n1)"
            [ "$highest_minor" != "$version" ] || tags="${tags},${image}:${minor}"
            highest="$( { git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//'; echo "$version"; } | sort -V | tail -n1)"
            if [ "$highest" = "$version" ]; then
              tags="${tags},${image}:latest"
            else
              echo "::notice::v${version} is not the highest release (${highest}) – \"latest\" stays unchanged."
            fi
          else
            tags="${image}:test-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          { echo "### AssetLotse ${version}"; echo "Tags: \`${tags//,/\`, \`}\`"; } >> "$GITHUB_STEP_SUMMARY"

      # build into a file – nothing is published yet
      - name: Build (not published yet)
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: assetlotse:scan
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # security scan – a finding stops here, before anything is pushed
  scan:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: assetlotse:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          output: trivy.txt
          exit-code: "1"

      - name: Scan result
        if: always()
        run: |
          [ -s trivy.txt ] || exit 0
          cat trivy.txt
          { echo "### Trivy (HIGH/CRITICAL with a fix)"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # publish exactly the scanned image, then create the release tag
  publish:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release tag v<version>
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          docker load -i "${RUNNER_TEMP}/image.tar"
          IFS=, read -ra tags <<< "$TAGS"
          for t in "${tags[@]}"; do
            docker tag assetlotse:scan "$t"
            docker push "$t"
          done

      - name: Create release tag
        if: needs.build.outputs.create_tag == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "::notice::Created tag v${VERSION}"

  # Weekly: scan the published "latest" again (new vulnerabilities are found all the time).
  scan-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull, then log out: the scanner reads the image from the local Docker, without registry login
      - name: Pull latest
        id: img
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$ref"
          docker logout ghcr.io
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ref")" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.img.outputs.ref }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          output: trivy.txt
          exit-code: "1"

      - name: Scan result
        if: always()
        env:
          REF: ${{ steps.img.outputs.ref }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          [ -s trivy.txt ] || exit 0
          cat trivy.txt
          { echo "### Trivy: ${REF} (${VERSION})"
            echo "A finding here means: build a new version (base image / packages updated)."
            echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
