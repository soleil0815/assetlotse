# Builds the AssetLotse image on GitHub and publishes it to ghcr.io/<owner>/<repo>.
#
# Release – automatic: push to master with a new version in assetlotse/__init__.py. If there is no tag
#   v<version> yet, the image is built (tags <version>, <minor> and – if it is the highest release –
#   "latest") and the tag v<version> is created. Pushes without a new version build nothing.
# Release – by hand (still works): git tag v1.9.0 && git push origin v1.9.0
# Test: Actions → Docker image → Run workflow → tag "test-<commit>" (release tags stay untouched).
#
# Security scan: every image is checked with Trivy BEFORE it is pushed. Known HIGH or CRITICAL vulnerabilities
#   that already have a fix (Debian packages and Python packages) stop the release – nothing is published,
#   "latest" stays on the previous version. Fix: update the base image digest or the package in
#   requirements.txt, raise the version, push again. A deliberate exception goes into .trivyignore.
# Weekly rebuild (security updates): every Monday the highest release is built again from its tag, on the newest
#   Python image of its line (e.g. python:3.13-slim-trixie) and with all Debian updates. It is tested and scanned
#   like a release and – only if both pass and something actually changed – published as "latest", "<minor>" and
#   "<version>-<date>". The exact tag "<version>" stays the image as released. The Python packages stay as pinned
#   in requirements.txt. A failed run changes nothing (GitHub sends an e-mail). By hand: Run workflow → weekly.
# Jobs: build (read only) → test + scan (read only, the scanner never sees write access or registry login)
#   → publish (write access, pushes exactly the tested and scanned image and creates the tag).
#
# On the server:  ./update.sh --pull   (see README, "Ready-made images from GitHub")
# Actions are pinned to commit SHAs (the comment shows the version) – update them deliberately.
name: Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = image test-<commit>; weekly = security rebuild of the highest release now"
        type: choice
        options: [test, weekly]
        default: test
  schedule:
    - cron: "17 5 * * 1"      # Mondays 05:17 UTC: security rebuild of the highest release

permissions: {}           # every job states what it needs

concurrency:
  group: docker-release          # one build at a time – releases and weekly rebuilds
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.75.0
  PYTEST_VERSION: 9.1.1
  WEEKLY: ${{ github.event_name == 'schedule' || inputs.mode == 'weekly' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # check whether the version is already published
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
      ref: ${{ steps.meta.outputs.revision }}
      publish: ${{ steps.meta.outputs.weekly != 'true' || steps.diff.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # all tags, to decide whether this release becomes "latest"
          persist-credentials: false

      - name: "Weekly: check out the highest release"
        if: env.WEEKLY == 'true'
        run: |
          highest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          [ -n "$highest" ] || { echo "::error::No release tag found"; exit 1; }
          cp .github/image-fingerprint.sh "${RUNNER_TEMP}/fp.sh"     # helper from master, not from the old tag
          git checkout -q "$highest"
          echo "::notice::Security rebuild of ${highest}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and tags
        id: meta
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' assetlotse/__init__.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No valid __version__ in assetlotse/__init__.py"; exit 1; }
          grep -q "org.opencontainers.image.version=\"${version}\"" Dockerfile \
            || { echo "::error::Dockerfile LABEL org.opencontainers.image.version is not ${version}"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$WEEKLY" = true ]; then
            # newest Python image of the pinned line, e.g. python:3.13.16-slim-trixie@sha256:… → python:3.13-slim-trixie
            base="$(sed -n 's/^ARG PYTHON_IMAGE=python:\([0-9]*\.[0-9]*\)\.[0-9]*\(-[^@]*\)@.*/python:\1\2/p' Dockerfile)"
            [ -n "$base" ] || { echo "::error::Cannot read ARG PYTHON_IMAGE in the Dockerfile"; exit 1; }
            stamp="$(date -u +%Y%m%d)"
            tags="${image}:latest,${image}:${version%.*},${image}:${version}-${stamp}"
            { echo "skip=false"; echo "create_tag=false"; echo "weekly=true"; echo "tags=${tags}"
              echo "build_args<<EOF"; echo "PYTHON_IMAGE=${base}"; echo "OS_UPGRADE=${stamp}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            { echo "### Security rebuild of ${version}"; echo "Base: \`${base}\` + Debian updates"
              echo "Tags (if tests and scan pass and something changed): \`${tags//,/\`, \`}\`"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            # released = the image exists in the registry (a tag alone is not enough, e.g. after a failed build)
            if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
              echo "::notice::${version} is already published – nothing to build (raise the version to release)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          create_tag=false
          if [ "${GITHUB_REF_TYPE}" = branch ] && [ "$release" = true ] && ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            create_tag=true
          fi
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} (expected v${version})"; exit 1
            fi
            tags="${image}:${version}"
            # the minor tag (e.g. 1.9) only moves forward within its line
            minor="${version%.*}"
            highest_minor="$( { git tag -l "v${minor}.[0-9]*" | sed 's/^v//'; echo "$version"; } | sort -V | tail -n1)"
            [ "$highest_minor" != "$version" ] || tags="${tags},${image}:${minor}"
            highest="$( { git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//'; echo "$version"; } | sort -V | tail -n1)"
            if [ "$highest" = "$version" ]; then
              tags="${tags},${image}:latest"
            else
              echo "::notice::v${version} is not the highest release (${highest}) – \"latest\" stays unchanged."
            fi
          else
            tags="${image}:test-${GITHUB_SHA::7}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          { echo "### AssetLotse ${version}"; echo "Tags: \`${tags//,/\`, \`}\`"; } >> "$GITHUB_STEP_SUMMARY"

      # build into a file – nothing is published yet
      - name: Build (not published yet)
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: assetlotse:scan
          build-args: ${{ steps.meta.outputs.build_args }}
          no-cache: ${{ steps.meta.outputs.weekly == 'true' }}   # weekly: everything fresh
          pull: ${{ steps.meta.outputs.weekly == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # weekly: publish only if something changed (otherwise every server would restart for nothing)
      - name: "Weekly: compare with latest"
        id: diff
        if: steps.meta.outputs.weekly == 'true'
        env:
          LATEST: ghcr.io/${{ github.repository }}:latest
        run: |
          latest="${LATEST,,}"
          fingerprint() {
            docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$1"
            docker run --rm -v "${RUNNER_TEMP}/fp.sh:/tmp/fp.sh:ro" --entrypoint sh "$1" /tmp/fp.sh
          }
          docker load -q -i "${RUNNER_TEMP}/image.tar"
          fingerprint assetlotse:scan > new.txt
          if docker pull -q "$latest" >/dev/null 2>&1 && fingerprint "$latest" > old.txt && cmp -s old.txt new.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No updates since the last image – latest stays as it is (tests and scan still run)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "#### Changes against latest"; echo '```'; diff old.txt new.txt 2>/dev/null | grep '^[<>]' | head -n 60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # the test suite, run with exactly the Python and packages of the built image
  test:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Tests in the image
        run: |
          docker load -q -i "${RUNNER_TEMP}/image.tar"
          # pytest goes only into this throw-away container; the published image stays without pip
          docker run --rm -v "$PWD:/src" -w /src -e PYTEST_VERSION --entrypoint sh assetlotse:scan -c '
            python -m ensurepip -q >/dev/null 2>&1 &&
            python -m pip install -q "pytest==${PYTEST_VERSION}" &&
            python -m pytest -q -p no:cacheprovider tests'

  # security scan – a finding stops here, before anything is pushed
  scan:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: assetlotse:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy.json
          exit-code: "1"

      - name: Scan result
        if: always()
        env:
          HEADING: Trivy (HIGH/CRITICAL with a fix)
        run: .github/trivy-report.sh trivy.json

  # publish exactly the scanned image, then create the release tag
  publish:
    needs: [build, test, scan]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release tag v<version>
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          docker load -i "${RUNNER_TEMP}/image.tar"
          IFS=, read -ra tags <<< "$TAGS"
          for t in "${tags[@]}"; do
            docker tag assetlotse:scan "$t"
            docker push "$t"
          done

      - name: Create release tag
        if: needs.build.outputs.create_tag == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "::notice::Created tag v${VERSION}"
